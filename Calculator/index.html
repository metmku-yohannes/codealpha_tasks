
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="calculator">
    <h1>Calculator</h1>

    <section class="display" aria-label="Calculator display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </section>

    <section class="buttons" aria-label="Calculator buttons">
      <button type="button" class="function" data-action="clear">C</button>
      <button type="button" class="function" data-action="sign">+/−</button>
      <button type="button" class="function" data-action="percent">%</button>
      <button type="button" class="operator" data-action="divide">÷</button>

      <button type="button" data-number="7">7</button>
      <button type="button" data-number="8">8</button>
      <button type="button" data-number="9">9</button>
      <button type="button" class="operator" data-action="multiply">×</button>

      <button type="button" data-number="4">4</button>
      <button type="button" data-number="5">5</button>
      <button type="button" data-number="6">6</button>
      <button type="button" class="operator" data-action="subtract">−</button>

      <button type="button" data-number="1">1</button>
      <button type="button" data-number="2">2</button>
      <button type="button" data-number="3">3</button>
      <button type="button" class="operator" data-action="add">+</button>

      <button type="button" class="zero" data-number="0">0</button>
      <button type="button" data-action="decimal">.</button>
      <button type="button" class="equals" data-action="calculate">=</button>
    </section>
  </main>

  <script src="script.js"></script>

</body>
</html>
